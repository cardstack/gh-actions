name: Docker AWS ECR
description: Build docker image and push to AWS ECR

inputs:
  repository:
    required: true
    description: "Name of the ECR repository"
  environment:
    required: true
    description: "Deployment environment"
  dockerfile:
    required: false
    default: "Dockerfile"
    description: "Path to Dockerfile"
  context:
    required: false
    default: "."
    description: "Docker build context"
  build-args:
    required: false
    description: "Docker build args"
  platforms:
    required: false
    description: "Target platform"
    default: "linux/amd64"
  push-by-digest:
    required: false
    default: "false"
    description: >-
      "true" pushes the image for the single platform in `platforms` by digest
      only, with no tags, and sets the `digest` output. Used to build each
      platform of a multi-arch image on its own native runner.
  merge-digests:
    required: false
    default: ""
    description: >-
      Image digests (one per line) that earlier push-by-digest runs pushed to
      this repository. When set, nothing is built: the digests are joined into
      one multi-arch image under the usual tags.

outputs:
  tag_sha:
    description: "Final image tag"
    value: ${{ steps.tags.outputs.tag_sha }}
  digest:
    description: "Image digest, set when push-by-digest is true"
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Check inputs
      if: ${{ inputs.push-by-digest == 'true' && inputs.merge-digests != '' }}
      shell: bash
      run: |
        echo "::error::Set push-by-digest or merge-digests, not both"
        exit 1

    - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Set up env
      shell: bash
      run: |
        if [ "${{ inputs.environment }}" = "production" ]; then
          echo "AWS_ROLE_ARN=arn:aws:iam::120317779495:role/github" >> $GITHUB_ENV
        elif [ "${{ inputs.environment }}" = "staging" ]; then
          echo "AWS_ROLE_ARN=arn:aws:iam::680542703984:role/github" >> $GITHUB_ENV
        else
          echo "unrecognized environment"
          exit 1;
        fi

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        aws-region: us-east-1

    - id: login-ecr
      uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2.1.5

    - id: tags
      shell: bash
      env:
        PUSH_BY_DIGEST: ${{ inputs.push-by-digest }}
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        TAG_PREFIX="${{ steps.login-ecr.outputs.registry }}/${{ inputs.repository }}"
        TAG_SHA="${TAG_PREFIX}:${GITHUB_SHA::7}"
        TAG_ENV="${TAG_PREFIX}:${{ inputs.environment }}"
        TAG_LATEST="${TAG_PREFIX}:latest"
        echo "tag_prefix=${TAG_PREFIX}" >> $GITHUB_OUTPUT
        echo "tag_sha=${TAG_SHA}" >> $GITHUB_OUTPUT
        echo "tag_env=${TAG_ENV}" >> $GITHUB_OUTPUT
        echo "tag_latest=${TAG_LATEST}" >> $GITHUB_OUTPUT
        if [ "$PUSH_BY_DIGEST" = "true" ]; then
          # A per-platform build keeps its own cache, so the platforms don't
          # overwrite each other's. amd64 keeps the `:buildcache` tag that
          # single-platform builds already fill.
          ARCH="$(echo "$PLATFORMS" | cut -d/ -f2)"
          if [ "$ARCH" != "amd64" ]; then
            echo "tag_buildcache=${TAG_PREFIX}:buildcache-${ARCH}" >> $GITHUB_OUTPUT
          else
            echo "tag_buildcache=${TAG_PREFIX}:buildcache" >> $GITHUB_OUTPUT
          fi
          echo "build_outputs=type=image,name=${TAG_PREFIX},push-by-digest=true,name-canonical=true,push=true" >> $GITHUB_OUTPUT
          echo "build_tags=" >> $GITHUB_OUTPUT
        else
          echo "tag_buildcache=${TAG_PREFIX}:buildcache" >> $GITHUB_OUTPUT
          echo "build_outputs=" >> $GITHUB_OUTPUT
          {
            echo "build_tags<<EOF"
            echo "$TAG_LATEST"
            echo "$TAG_SHA"
            echo "$TAG_ENV"
            echo "EOF"
          } >> $GITHUB_OUTPUT
        fi

    - name: Build and push
      id: build
      if: ${{ inputs.merge-digests == '' }}
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        # A push-by-digest build pushes through `outputs` instead.
        push: ${{ inputs.push-by-digest != 'true' }}
        outputs: ${{ steps.tags.outputs.build_outputs }}
        # Cache layers in an ECR `:buildcache` tag rather than the GHA cache
        # backend: ECR pulls in-region are far faster for large pnpm-fetch
        # layers, where the GHA backend transfers too slowly to be a net win.
        # `image-manifest=true,oci-mediatypes=true` is required — ECR rejects
        # the default cache manifest format buildx uses for other registries.
        # `ignore-error=true` keeps a build green if the cache export is denied
        # (e.g. a role lacking `ecr:PutImage`) or ECR has a transient hiccup.
        cache-from: type=registry,ref=${{ steps.tags.outputs.tag_buildcache }}
        cache-to: type=registry,ref=${{ steps.tags.outputs.tag_buildcache }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
        platforms: ${{ inputs.platforms }}
        build-args: ${{ inputs.build-args }}
        tags: ${{ steps.tags.outputs.build_tags }}

    - name: Push multi-arch image
      if: ${{ inputs.merge-digests != '' }}
      shell: bash
      env:
        TAG_PREFIX: ${{ steps.tags.outputs.tag_prefix }}
        TAG_LATEST: ${{ steps.tags.outputs.tag_latest }}
        TAG_SHA: ${{ steps.tags.outputs.tag_sha }}
        TAG_ENV: ${{ steps.tags.outputs.tag_env }}
        DIGESTS: ${{ inputs.merge-digests }}
      run: |
        sources=()
        while read -r digest; do
          [ -n "$digest" ] && sources+=("${TAG_PREFIX}@${digest}")
        done <<< "$DIGESTS"
        docker buildx imagetools create \
          -t "$TAG_LATEST" -t "$TAG_SHA" -t "$TAG_ENV" \
          "${sources[@]}"
        docker buildx imagetools inspect "$TAG_SHA"
