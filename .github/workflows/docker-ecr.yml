name: Build docker image and push to ecr

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      environment:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      context:
        required: false
        type: string
        default: "."
      build-args:
        required: false
        type: string
      platforms:
        description: >-
          Comma-separated target platforms. Empty or "linux/amd64" builds on
          ubuntu-latest. Any other value builds each platform on its own
          native runner (see runner-amd64 / runner-arm64) and joins the
          results into one image.
        required: false
        type: string
      runner-amd64:
        description: Runner for the linux/amd64 build of a native-runner image.
        required: false
        type: string
        default: "ubuntu-latest"
      runner-arm64:
        description: Runner for the linux/arm64 build of a native-runner image.
        required: false
        type: string
        default: "ubuntu-24.04-arm"
    outputs:
      image:
        description: "Final image tag"
        value: ${{ jobs.build.outputs.tag_sha || jobs.merge.outputs.tag_sha }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build
    if: ${{ inputs.platforms == '' || inputs.platforms == 'linux/amd64' }}
    runs-on: ubuntu-latest
    concurrency:
      group: docker-ecr-build-${{ inputs.repository }}-${{ inputs.environment }}-${{ github.head_ref || github.run_id }}
    outputs:
      tag_sha: ${{ steps.this.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: this
        uses: cardstack/gh-actions/docker-ecr@cs-14517-native-arm64-image-builds
        with:
          environment: ${{ inputs.environment }}
          repository: ${{ inputs.repository }}
          dockerfile: ${{ inputs.dockerfile }}
          context: ${{ inputs.context }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}

  # Every other platform list builds each platform natively instead of under
  # QEMU emulation, which is many times slower for a Node build.
  plan:
    name: Plan platform builds
    if: ${{ inputs.platforms != '' && inputs.platforms != 'linux/amd64' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      artifact-prefix: ${{ steps.plan.outputs.artifact-prefix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
          REPOSITORY: ${{ inputs.repository }}
          ENVIRONMENT: ${{ inputs.environment }}
          RUNNER_AMD64: ${{ inputs.runner-amd64 }}
          RUNNER_ARM64: ${{ inputs.runner-arm64 }}
        run: |
          # Artifact names can't contain "/". ECR repository names never hold
          # two separators in a row, so "__" for "/" and "--" between the
          # parts keep each repository's prefix from matching another's.
          prefix="docker-ecr-digest--${ENVIRONMENT}--${REPOSITORY//\//__}"
          seen=" "
          entries=()
          IFS=',' read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            platform="$(echo "$platform" | xargs)"
            [ -z "$platform" ] && continue
            # os/arch[/variant]
            arch="$(echo "$platform" | cut -d/ -f2)"
            case "$arch" in
              amd64) runner="$RUNNER_AMD64" ;;
              arm64) runner="$RUNNER_ARM64" ;;
              *) echo "::error::No runner for platform $platform"; exit 1 ;;
            esac
            case "$seen" in
              *" $arch "*)
                echo "::error::platforms names $arch more than once: $PLATFORMS"
                exit 1 ;;
            esac
            seen="${seen}${arch} "
            entries+=("$(jq -cn --arg p "$platform" --arg a "$arch" --arg r "$runner" \
              --arg n "${prefix}--${arch}" \
              '{platform: $p, arch: $a, runner: $r, artifact: $n}')")
          done
          if [ ${#entries[@]} -eq 0 ]; then
            echo "::error::platforms names no platform: '$PLATFORMS'"
            exit 1
          fi
          {
            echo "matrix=$(printf '%s\n' "${entries[@]}" | jq -cs '{include: .}')"
            echo "count=${#entries[@]}"
            echo "artifact-prefix=${prefix}"
          } >> "$GITHUB_OUTPUT"

  build-platform:
    name: Build ${{ matrix.platform }}
    needs: plan
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: docker-ecr-build-${{ inputs.repository }}-${{ inputs.environment }}-${{ matrix.arch }}-${{ github.head_ref || github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: this
        uses: cardstack/gh-actions/docker-ecr@cs-14517-native-arm64-image-builds
        with:
          environment: ${{ inputs.environment }}
          repository: ${{ inputs.repository }}
          dockerfile: ${{ inputs.dockerfile }}
          context: ${{ inputs.context }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ matrix.platform }}
          push-by-digest: "true"
      - name: Save digest
        env:
          DIGEST: ${{ steps.this.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 1
          overwrite: true

  merge:
    name: Push multi-arch image
    needs: [plan, build-platform]
    runs-on: ubuntu-latest
    concurrency:
      group: docker-ecr-merge-${{ inputs.repository }}-${{ inputs.environment }}-${{ github.head_ref || github.run_id }}
    outputs:
      tag_sha: ${{ steps.this.outputs.tag_sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.plan.outputs.artifact-prefix }}--*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - id: digests
        env:
          EXPECTED: ${{ needs.plan.outputs.count }}
        run: |
          found="$(find "$RUNNER_TEMP/digests" -type f | wc -l | xargs)"
          if [ "$found" != "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED platform digests, found $found"
            exit 1
          fi
          {
            echo "list<<EOF"
            cat "$RUNNER_TEMP"/digests/*
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - id: this
        uses: cardstack/gh-actions/docker-ecr@cs-14517-native-arm64-image-builds
        with:
          environment: ${{ inputs.environment }}
          repository: ${{ inputs.repository }}
          merge-digests: ${{ steps.digests.outputs.list }}
